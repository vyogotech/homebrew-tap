name: Build and Publish Bottles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach bottles to (e.g. v16.0.0)'
        required: false
        default: 'v16.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-bottle:
    name: Bottle · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Register local tap in Homebrew
        run: |
          TAP_DIR="$(brew --repository vyogotech/tap)"
          mkdir -p "$(dirname "$TAP_DIR")"
          rm -rf "$TAP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"
          brew trust vyogotech/tap

      - name: Build Formula & Generate Bottle
        id: bottle
        run: |
          TAG="${{ inputs.tag || github.ref_name || 'v16.0.0' }}"
          ROOT_URL="https://github.com/vyogotech/homebrew-tap/releases/download/${TAG}"
          
          # Install dependencies first
          brew install mariadb redis node yarn python@3.14

          # Install and build bottle
          brew install --build-bottle vyogotech/tap/vybench

          # Generate bottle tarball and json
          mkdir -p bottles
          cd bottles
          brew bottle --json --root-url="$ROOT_URL" vyogotech/tap/vybench

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ matrix.os }}
          path: bottles/*
          retention-days: 1

  publish:
    name: Publish Bottles & Update Formula
    needs: [build-bottle]
    runs-on: macos-14
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Register local tap in Homebrew
        run: |
          TAP_DIR="$(brew --repository vyogotech/tap)"
          mkdir -p "$(dirname "$TAP_DIR")"
          rm -rf "$TAP_DIR"
          ln -s "$GITHUB_WORKSPACE" "$TAP_DIR"

      - name: Download all bottle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bottles-*
          path: all-bottles
          merge-multiple: true

      - name: Inspect generated bottles
        run: |
          ls -la all-bottles/

      - name: Merge bottle block into formula
        run: |
          cd all-bottles
          brew bottle --merge --write *.json
          cp vybench.rb ../Formula/vybench.rb || cp ../Formula/vybench.rb .

      - name: Commit and push updated formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vybench.rb
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: add bottles for ${{ inputs.tag || github.ref_name || 'v16.0.0' }}"
          git push origin main

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name || 'v16.0.0' }}"
          gh release view "$TAG" --repo vyogotech/homebrew-tap 2>/dev/null || \
            gh release create "$TAG" --repo vyogotech/homebrew-tap --title "Vybench $TAG" --notes "Pre-built binary bottles for Vybench $TAG"
          gh release upload "$TAG" all-bottles/*.bottle.tar.gz --clobber --repo vyogotech/homebrew-tap
